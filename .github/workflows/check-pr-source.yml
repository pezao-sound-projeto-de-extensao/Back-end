name: check-pr-source.yml
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - main

jobs:
  check-source:
    runs-on: ubuntu-latest
    if: ${{ github.head_ref != 'development' }}
    steps:
      - name: Bloquear PR de branches não autorizadas
        run: |
          echo "PR só pode vir da branch development, branch atual: ${{ github.head_ref }}"
          exit 1
