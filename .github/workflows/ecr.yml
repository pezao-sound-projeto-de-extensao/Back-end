name: ecr.yml

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

jobs:
  build-and-push:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    env:
      REPOSITORY: pezao-sound-api

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Autenticando no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata para a tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build da imagem e envio ao repositório
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SPRING_PROFILE=prod
