spring.application.name=backend
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:stockflow}?useTimezone=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USERNAME}

# Sem valor padrão de propósito: a aplicação não sobe em produção sem essas variáveis definidas.
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

app.cors.origens-permitidas=${CORS_ORIGENS}

# Armazenamento local de arquivos
app.storage.local.diretorio=${STORAGE_DIR:/var/pezao-sound/uploads}

# Limites de upload multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
