spring.application.name=backend
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:stockflow}?useTimezone=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USERNAME}

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Armazenamento de arquivos (AWS S3)
aws.s3.bucket=${AWS_S3_BUCKET:teste-864676094228-us-east-1-an}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# Limites de upload multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB