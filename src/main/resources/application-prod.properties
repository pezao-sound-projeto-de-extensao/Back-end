spring.application.name=backend
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:stockflow}?useTimezone=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USERNAME}

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Armazenamento de arquivos (AWS S3)
aws.s3.bucket=${AWS_S3_BUCKET}
aws.region=${AWS_S3_REGION:us-east-1}

# Limites de upload multipart
spring.servlet.multipart.max-file-size=14MB
spring.servlet.multipart.max-request-size=14MB

# Timezone da aplicação
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

#Path aceitos no CORS
app.cors.allowed-origins=${CORS}