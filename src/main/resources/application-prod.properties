spring.application.name=backend
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:stockflow}?useTimezone=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USERNAME}

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Armazenamento de arquivos (AWS S3)
aws.s3.bucket=${AWS_S3_BUCKET}
aws.region=${AWS_S3_REGION:us-east-1}
# Sobrescreve os valores de dev do application.properties (floci em localhost:4566,
# credenciais "test"). Com endpoint vazio o S3ArmazenamentoStrategy usa o
# DefaultCredentialsProvider, que obtém as credenciais da IAM role da instância.
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
aws.s3.path-style-access=false

# Limites de upload multipart
spring.servlet.multipart.max-file-size=14MB
spring.servlet.multipart.max-request-size=14MB

# Timezone da aplicação
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

#Path aceitos no CORS
app.cors.allowed-origins=${CORS}

# Mensageria (RabbitMQ)
# A porta e o vhost precisam de padrão: sem ele, "${RABBITMQ_PORT}" chega como texto,
# não converte para número e a aplicação inteira deixa de subir.
# Container na própria EC2: RABBITMQ_HOST=rabbitmq (padrão abaixo)
# Amazon MQ: RABBITMQ_HOST=b-xxxx.mq.us-east-1.amazonaws.com  RABBITMQ_PORT=5671  RABBITMQ_SSL=true
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# E-mail (Amazon SES via SMTP)
spring.mail.host=${MAIL_HOST:email-smtp.us-east-1.amazonaws.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# MAIL_FROM (remetente verificado no SES) vem do application.properties base e deve
# ser definido no ambiente. Sem valor padrão aqui, a ausência dele derrubaria a aplicação.
# O link de redefinição de senha usa o endereço da variável CORS (o DNS do load balancer).
