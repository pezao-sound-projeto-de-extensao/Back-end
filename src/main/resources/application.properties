spring.application.name=backend

# O Hibernate não altera mais nada por conta própria.
spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/stockflow?useTimezone=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=stockflow
spring.datasource.password=stockflow
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Segredo apenas de desenvolvimento. Em produção vem da variável de ambiente JWT_SECRET.
jwt.secret=${JWT_SECRET:dev-only-secret-nao-usar-em-producao-1234567890abcdef}
jwt.expiration=300000
jwt.refresh-expiration=604800000

# CORS - Origin do frontend (pode ser sobrescrito via env CORS_ALLOWED_ORIGIN)
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

spring.jdbc.template.max-rows=500
logging.level.org.springframework.jdbc.core.JdpiobcTemplate=DEBUG

# Armazenamento de arquivos (imagens de produto e notas de entrada)
aws.s3.bucket=${AWS_S3_BUCKET:stockflow-dev}
aws.region=${AWS_REGION:us-east-1}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:test}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:test}
aws.s3.path-style-access=${AWS_S3_PATH_STYLE_ACCESS:true}

# Limites de upload multipart
spring.servlet.multipart.max-file-size=14MB
spring.servlet.multipart.max-request-size=14MB

# Timezone da aplicação
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

#Path aceitos no CORS
app.cors.allowed-origins=${CORS:http://localhost:5173}

# Mensageria (RabbitMQ)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:stockflow}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:stockflow}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=3

# E-mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.email.remetente=${MAIL_FROM:nao-responda@stockflow.local}

# Recuperação de senha
app.recuperacao-senha.validade=30m

logging.level.org.springframework.amqp.support.converter.JacksonJsonMessageConverter=ERROR

logging.level.eventos=OFF

# O ALB (prod) e o nginx (dev) só encaminham /api/* para o back, então o Swagger fica debaixo de /api
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.config-url=/api/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/api/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.with-credentials=true
