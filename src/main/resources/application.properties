spring.application.name=backend

# O Hibernate não altera mais nada por conta própria.
spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/stockflow?useTimezone=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=stockflow
spring.datasource.password=stockflow
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Segredo apenas de desenvolvimento. Em produção vem da variável de ambiente JWT_SECRET.
jwt.secret=${JWT_SECRET:dev-only-secret-nao-usar-em-producao-1234567890abcdef}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# CORS - Origin do frontend (pode ser sobrescrito via env CORS_ALLOWED_ORIGIN)
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

spring.jdbc.template.max-rows=500
logging.level.org.springframework.jdbc.core.JdpiobcTemplate=DEBUG

# Armazenamento de arquivos (imagens de produto e notas de entrada)
aws.s3.bucket=${AWS_S3_BUCKET:stockflow-dev}
aws.region=${AWS_REGION:us-east-1}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:test}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:test}
aws.s3.path-style-access=${AWS_S3_PATH_STYLE_ACCESS:true}

# Limites de upload multipart
spring.servlet.multipart.max-file-size=14MB
spring.servlet.multipart.max-request-size=14MB

# Timezone da aplicação
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

#Path aceitos no CORS
app.cors.allowed-origins=${CORS:*}