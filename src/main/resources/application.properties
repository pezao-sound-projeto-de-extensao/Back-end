spring.application.name=backend

# O Hibernate não altera mais nada por conta própria.
spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=jdbc:mysql://localhost:3308/stockflow?useTimezone=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=stockflow
spring.datasource.password=stockflow
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Segredo apenas de desenvolvimento. Em produção vem da variável de ambiente JWT_SECRET.
jwt.secret=${JWT_SECRET:dev-only-secret-nao-usar-em-producao-1234567890abcdef}
jwt.expiration=900000
jwt.refresh-expiration=604800000

spring.jdbc.template.max-rows=500
logging.level.org.springframework.jdbc.core.JdpiobcTemplate=DEBUG

# Armazenamento de arquivos (imagens de produto e notas de entrada)
aws.s3.bucket=stockflow-dev
aws.region=us-east-1
aws.s3.endpoint=http://localhost:4566
aws.s3.access-key=test
aws.s3.secret-key=test
aws.s3.path-style-access=true

# Limites de upload multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB