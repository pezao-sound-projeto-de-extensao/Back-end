spring.application.name=backend

# O esquema do banco pertence às migrations do Flyway (src/main/resources/db/migration).
# O Hibernate não altera mais nada por conta própria.
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema existente antes da adocao do Flyway
spring.datasource.url=jdbc:mysql://localhost:3307/stockflow?useTimezone=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=minha_senha_segura
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Segredo apenas de desenvolvimento. Em produção vem da variável de ambiente JWT_SECRET.
jwt.secret=${JWT_SECRET:dev-only-secret-nao-usar-em-producao-1234567890abcdef}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Origens liberadas para o front (separadas por vírgula)
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}

spring.jdbc.template.max-rows=500
logging.level.org.springframework.jdbc.core.JdpiobcTemplate=DEBUG

# Armazenamento de arquivos (imagens de produto e notas de entrada)
aws.s3.bucket=${AWS_S3_BUCKET:teste-864676094228-us-east-1-an}
aws.region=${AWS_S3_REGION:us-east-1}

# Limites de upload multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB