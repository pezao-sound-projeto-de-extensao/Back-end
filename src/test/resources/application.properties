# Configuração padrão dos testes. Este arquivo tem precedência sobre o
# application.properties de src/main durante a execução da suíte.

# As migrations são específicas de MySQL; nos testes o esquema vem do Hibernate.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-secret-apenas-para-a-suite-de-testes-1234567890
jwt.expiration=900000
jwt.refresh-expiration=604800000

app.cors.origens-permitidas=http://localhost:5173
app.storage.local.diretorio=./target/test-uploads
