services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      - DEBUG=1
    volumes:
      - floci-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.0
    container_name: mysql-dev
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: stockflow
      MYSQL_DATABASE: stockflow
      MYSQL_USER: stockflow
      MYSQL_PASSWORD: stockflow
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  init-s3:
    image: amazon/aws-cli:latest
    container_name: init-s3
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Aguardando Floci..."
        until aws --endpoint-url http://floci:4566 s3 ls > /dev/null 2>&1; do
          echo "Floci não disponível..."
          sleep 2
        done
        echo "Criando bucket..."
        aws --endpoint-url http://floci:4566 s3 mb s3://stockflow-dev || true
        echo "Bucket pronto!"

  # Fila das tarefas em segundo plano (processamento de imagens e envio de e-mails).
  # Painel de administração: http://localhost:15672 (usuário e senha: stockflow)
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # O usuário "guest" padrão só aceita conexões de dentro do próprio container,
      # então a aplicação rodando na máquina host não conseguiria se conectar com ele.
      RABBITMQ_DEFAULT_USER: stockflow
      RABBITMQ_DEFAULT_PASS: stockflow
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Servidor SMTP falso: captura todos os e-mails enviados, sem entregar a ninguém.
  # Caixa de entrada: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-dev
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  floci-data:
  mysql-data:
  rabbitmq-data: